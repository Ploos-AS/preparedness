schema_version: 1
id: household-baseline
scope: common
principle: "Books localise the baseline; they do not silently replace it."
domains:
  - water
  - food
  - heat_and_clothing
  - light_and_energy
  - information_and_communications
  - payments
  - hygiene
  - medicines_and_first_aid
  - pets
jurisdiction_overrides:
  NO:
    planning_period_days: 7
    water:
      stored_litres_per_person_week: 20
      status: authoritative
      authority: DSB
      source:
        title: Vann i beredskap
        url: https://www.dsb.no/sikkerhverdag/egenberedskap/vann-i-beredskap/
        source_license: TO_VERIFY
        verified_on: "2026-09-29"
        review_due: "2027-03-29"
    payments:
      principles:
        - multiple_payment_cards
        - physical_bankaxept_card
        - some_cash
        - smaller_denominations
        - accounts_in_multiple_banks
      cash_amount_rule: household_specific
      status: authoritative
      authority: Norges Bank
      source:
        title: Egenberedskap for å betale
        url: https://www.norges-bank.no/egenberedskap
        source_license: TO_VERIFY
        verified_on: "2026-09-29"
        review_due: "2027-03-29"
notes:
  - "Cash amount is not a universal fixed number; base it on necessary purchases and what the household already stores."
  - "Country-specific facts require source and review metadata before publication."
