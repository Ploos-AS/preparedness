schema_version: 1
worksheet: power-inventory
fields:
  - device
  - quantity
  - measured_watts
  - starting_watts
  - hours_per_day
  - duty_cycle
  - essential
derived:
  - watt_hours_per_day
toolkit:
  commands:
    - ploos-prep battery
    - ploos-prep power
future_toolkit:
  - ploos-prep energy
note: Record measured consumption where practical; name estimates as estimates. The future energy command will calculate Wh/day directly from watts, hours and duty cycle.
