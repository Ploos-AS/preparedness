principles:
  - Keep fridge and freezer doors closed as much as practical during a power cut.
  - Base food-safety decisions on measured temperature, time, food type and qualified current guidance.
  - Do not use a universal discard-after-X-hours rule.
  - Outdoor winter conditions are not automatically controlled cold storage.
