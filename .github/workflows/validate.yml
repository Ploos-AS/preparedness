name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python tools/validate.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o ploos-prep ./cmd/ploos-prep
      - run: pip install -r requirements-ci.txt
      - run: python tools/generate_baseline_go.py
      - run: git diff --exit-code -- internal/baseline/generated.go
      - run: python tools/validate_cli_output.py
